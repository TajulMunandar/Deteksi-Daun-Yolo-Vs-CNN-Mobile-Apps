name: deteksi_daun_mobile
description: Flutter Mobile App for Leaf Detection using CNN and YOLO

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & UX
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.0
  flutter_spinkit: ^5.2.0
  
  # Camera & Image
  image_picker: ^1.0.4
  camera: ^0.10.5
  
  # Networking (switched from dio to http for better compatibility)
  http: ^1.1.0
  
  # State Management
  get: ^4.6.5
  
  # Image Processing
  image: ^4.1.3
  
  # Utilities
  path: ^1.8.3
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  shared_preferences: ^2.2.2
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
